<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  
  <div class="container">
    <header>
      <h1>Anime & Manga Explorer</h1>
      <p>Welcome to the Anime & Manga Explorer!</p>
      
      <div class="search-bar">
        <input id="search" type="text" placeholder="Search for anime or manga...">
        <button id="btn">
          <i data-lucide="search" class="icon"></i> Search
        </button>
      </div>
    </header>

    <div id="result" class="grid-container"></div>
  </div>

  <script src="index.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
